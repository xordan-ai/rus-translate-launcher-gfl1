name: build-apk
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then echo "settings.gradle.kts не найден в репозитории"; exit 1; fi
          cd "$(dirname "$F")"
          echo "Проект лежит в: $(pwd)"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GflRuLauncher-debug
          path: "**/build/outputs/apk/debug/*.apk"
